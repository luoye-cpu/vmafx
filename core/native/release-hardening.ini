# Release hardening profile — the one place the documented release hardening
# flags are defined (docs/principles.md section 2.2, issue 2748).
#
# Copyright 2026 Lusoris
# SPDX-License-Identifier: EUPL-1.2
#
# Every release build of the C/C++ tree (the native Linux bundle, the release
# container images and the binary wheels) passes this file to `meson setup`
# as `--native-file core/native/release-hardening.ini`. Development and CI
# test builds do not pass it, so their generated code stays untouched.
#
# The flags are the goals of docs/principles.md section 2.2 that a build can
# set at compile/link time:
#   * _FORTIFY_SOURCE=3 — requires optimization (release -O3). The effective
#     level is the builder's glibc headers': Debian 13 (glibc 2.41) applies
#     level 3, while the manylinux_2_28 bundle builder (AlmaLinux 8, glibc
#     2.28) silently maps 3 to the level-2 wrappers, which still fortifies
#     (the _chk entry points exist on every glibc this fork builds on).
#   * -fstack-protector-strong — canaries in every function with an
#     address-taken local.
#   * PIE: -fPIE at compile and -pie at link. Both are passed explicitly
#     rather than through meson's b_pie because the CUDA compiler meson wraps
#     (nvcc) has no PIE support (EnvironmentException), which would break the
#     GPU release legs; c_args/c_link_args never reach nvcc. Meson adds -fPIC
#     after -fPIE for shared libraries, so the chain stays PIC.
#   * RELRO + BIND_NOW: -Wl,-z,relro,-z,now (full RELRO; the toolchain default
#     is partial RELRO without -z now).
# scripts/release/check_release_hardening.py fails a release bundle whose
# staged binaries do not carry the resulting properties (PIE flag, PT_GNU_RELRO
# with BIND_NOW, __stack_chk_fail and __*_chk imports, no build-tree run path).
#
# Not covered here: Windows (MSVC has its own flags), macOS (no fortify) and
# the valgrind memcheck goal, which is an audit workflow, not a flag.
[built-in options]
c_args = ['-D_FORTIFY_SOURCE=3', '-fstack-protector-strong', '-fPIE']
cpp_args = ['-D_FORTIFY_SOURCE=3', '-fstack-protector-strong', '-fPIE']
c_link_args = ['-Wl,-z,relro,-z,now', '-pie']
cpp_link_args = ['-Wl,-z,relro,-z,now', '-pie']
