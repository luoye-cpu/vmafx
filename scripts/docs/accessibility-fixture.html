<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planted accessibility defects</title>
    <style>
      body { color: #222; background: #fff; }
      .low { color: #aaa; background: #fff; }
      .tiny { display: inline-flex; width: 16px; height: 16px; padding: 0; border: 0; margin: 0; font-size: 8px; }
      @media (prefers-color-scheme: dark) {
        body { color: #eee; background: #111; }
        .low { color: #333; background: #111; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A page with planted defects</h1>
      <h3>A skipped heading level</h3>
      <p><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="40" height="40"></p>
      <p class="low">Low-contrast text pair</p>
      <div><button class="tiny" aria-label="First target">1</button><button class="tiny" aria-label="Second target">2</button></div>
    </main>
  </body>
</html>
