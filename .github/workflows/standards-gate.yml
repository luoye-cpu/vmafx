name: Standards

# Praetor / HISS-21 governance gate (ADR-1249, ADR-1274).
#
# Runs on every pull request with no `paths:` filter on purpose: the HISS scan
# reads source, the baseline ratchet has to see every change, and a required
# context that silently does not start would leave the aggregator waiting on a
# check that never reports.
#
# `ready_for_review` is listed because the required aggregator ignores check
# runs older than its own run (e8b9c9cfa). Without it, a PR opened as a draft
# and later marked ready keeps only draft-era Standards runs, and the strict
# contexts below count as never reported.
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [master]

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least-privilege default for the whole workflow (ADR-0875).
permissions:
  contents: read

env:
  # Exact engine used to record the baseline and replay HISS evidence.
  PRAETOR_REF: 4ae64cb27e566e24ba988192a2b0d92405714d6a

# ADR-1506 — `Go API Compatibility` is the job of praetor-api.yml, a file
# praetor locks byte for byte, so its required-aggregator marker lives here.
# required-aggregator-job: Go API Compatibility
# ADR-2784 — `REUSE lint` is the job of reuse.yml, which praetor writes; its
# marker lives here beside the other praetor job's.
# required-aggregator-job: REUSE lint

jobs:
  tier:
    name: CI tier (Standards)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-tier.yml

  standards:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    # required-aggregator: Standards & Invariant Verification Gate
    name: Standards & Invariant Verification Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # `audit -base` diffs against the merge base, so the gate needs history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod  # single source of truth: the go directive in go.mod
          cache: true

      # praetor publishes no semver releases, only the moving tags
      # bleeding/edge/latest/lts, so the governance engine is pinned by commit
      # exactly like every other third-party dependency in this repo. Bumping it
      # is a deliberate PR: a newer praetor can tighten a policy and turn this
      # gate red on unrelated work.
      - name: Install praetorctl
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # No hook toolchain is installed here. Under CI the audit's hook gate only
      # checks that lefthook.yml is present; the local hook installation it
      # verifies on a developer machine is skipped by the engine itself.

      - name: Report the governance engine version
        run: standardsctl version

      # The canonical AGENTS.md is compiled into six vendor context files. This
      # fails if any of them was hand-edited, if AGENTS.md grew past the
      # 300-line-per-target budget, if a persona copy under a vendor agents
      # directory differs from (or has no source in) .agents/agents, or if
      # AGENTS.md is written in prose rather than the internal register.
      - name: Verify agent context integrity (HISS-16)
        run: standardsctl compile-context --verify

      # Deliberately the baseline-only form, not `audit -base <ref>`. The `-base`
      # mode adds a touched-file clean rule on top of the ratchet: every file a PR
      # touches must carry zero HISS infractions. Measured against this tree that
      # rule reports 220 infractions on an ordinary change set, because HISS-04
      # flags every function over 60 lines in any file the PR opens. It would block
      # routine fixes to legacy C for reasons unrelated to the fix. The ratchet
      # still holds without it: recorded debt may shrink and never grow. Revisit
      # `-base` once the baseline is low enough that touching a file is realistic
      # (ADR-1249).
      - name: Audit HISS invariants against the baseline
        run: standardsctl audit

      # The general HISS audit and its baseline do not include the AST clone
      # detector. Keep this explicit and fail-closed: duplicate implementation
      # families are defects regardless of origin or historical ownership.
      - name: Reject duplicate implementation families
        run: standardsctl dedupe scan .

      - name: Replay HISS enforcement evidence
        run: standardsctl hiss coverage --verify

  # required-aggregator: HISS Replay Evidence (Linux)
  # required-aggregator: HISS Replay Evidence (macOS)
  # required-aggregator: HISS Replay Evidence (Windows)
  hiss-replay-platforms:
    needs: tier
    if: needs.tier.outputs.light == 'true'
    name: HISS Replay Evidence (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned praetorctl
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Replay HISS enforcement evidence
        run: standardsctl hiss coverage --verify

  windows-hooks:
    needs: tier
    if: needs.tier.outputs.full == 'true'
    name: Windows Lefthook Pre-Commit
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Install pinned praetorctl
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          gobin="$(cygpath -u "$(go env GOPATH)/bin")"
          cp "$gobin/standardsctl.exe" "$gobin/praetorctl.exe"
          echo "$gobin" >> "$GITHUB_PATH"

      - name: Install lefthook
        run: |
          go install github.com/evilmartians/lefthook/v2@v2.1.14
          gobin="$(cygpath -u "$(go env GOPATH)/bin")"
          echo "$gobin" >> "$GITHUB_PATH"

      - name: Test lefthook pre-commit in a scratch clone
        run: |
          git -c core.autocrlf=false clone --shared . "$RUNNER_TEMP/scratch"
          # A clone maps the checkout's local branches to origin/*. A pull-request
          # checkout is a detached merge commit with no local master, so the
          # always-run hooks that resolve origin/master failed on every PR. Copy the
          # checkout's remote-tracking refs into the scratch clone.
          git -C "$RUNNER_TEMP/scratch" fetch --no-tags "$PWD" "+refs/remotes/origin/*:refs/remotes/origin/*"
          cd "$RUNNER_TEMP/scratch" || exit 1
          git config user.name "CI Worker"
          git config user.email "ci@example.invalid"
          python -m venv .venv
          cp .venv/Scripts/python.exe .venv/Scripts/python3.exe
          .venv/Scripts/python -m pip install --require-hashes -r requirements/locks/pre-commit.txt
          lefthook install
          # Install the pinned engine once before the parallel hooks start. On a cold
          # cache every hook ran install_pinned, and one hook's rename replaced the
          # binary another hook was executing (exit 126 busy / 127 missing).
          sh .config/lefthook/engine.sh --print-path
          touch test_scratch.txt
          git add test_scratch.txt
          lefthook run pre-commit --no-auto-install

  # Issue #3645: the repository asks every turn to run `make verify-all`, but
  # the forge had no run at the pull-request head for a reviewer or bot to read.
  # This advisory job publishes that evidence. It is deliberately not added to
  # Required Checks Aggregator: the required Standards job already runs the
  # audit, context, HISS and duplicate checks, and this job's value is the
  # artifact, not a second merge gate.
  #
  # Linux-only on purpose: `hiss-replay-platforms` owns the macOS/Windows HISS
  # replay evidence, while this job's value is the full command log a reviewer
  # can read, not a second platform-parity matrix.
  verify-all:
    needs: tier
    if: github.event_name == 'pull_request' && (needs.tier.outputs.light == 'true' || needs.tier.outputs.full == 'true')
    name: Verify All
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: tools/markdownlint/package-lock.json

      - name: Install the pinned governance engine
        run: sh .config/lefthook/engine.sh --print-path

      - name: Classify the diff (HISS-18)
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          sh .config/lefthook/engine.sh ci filter \
            --base "$BASE_SHA" --head "$HEAD_SHA" --env

      - name: No governance gate owed — verify-all skipped
        if: steps.filter.outputs.run_audit != 'true'
        run: |
          echo "::notice::make verify-all skipped: ci filter reports run_audit=false, which means only private session state changed; Standards, Docs, and the normal PR gates still report."

      - name: Run make verify-all and publish its log
        id: verify
        if: steps.filter.outputs.run_audit == 'true'
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/verify-all"
          mkdir -p "$out"
          log="$out/verify-all.log"
          receipt="$out/verify-all-receipt.txt"

          set +e
          make verify-all 2>&1 | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          tee_status=${statuses[1]}
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status=$tee_status
          fi
          set -e

          sha=$(sha256sum "$log" | awk '{print $1}')
          lines=$(wc -l < "$log")
          {
            printf 'command=%s\n' "make verify-all"
            printf 'head=%s\n' "$GITHUB_SHA"
            printf 'exit_code=%s\n' "$status"
            printf 'log_sha256=%s\n' "$sha"
            printf 'log_lines=%s\n' "$lines"
          } > "$receipt"

          {
            echo "### make verify-all"
            echo ""
            echo "- head: \`$GITHUB_SHA\`"
            echo "- exit: \`$status\`"
            echo "- log: \`verify-all.log\` (sha256 \`$sha\`, $lines lines)"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Upload verify-all log
        if: ${{ (always()) && env.GITEA_ACTIONS != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verify-all
          path: |
            ${{ runner.temp }}/verify-all/verify-all.log
            ${{ runner.temp }}/verify-all/verify-all-receipt.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verify-all log (Gitea)
        if: ${{ (always()) && env.GITEA_ACTIONS == 'true' }}
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf  # v3.2.2
        with:
          name: verify-all
          path: |
            ${{ runner.temp }}/verify-all/verify-all.log
            ${{ runner.temp }}/verify-all/verify-all-receipt.txt
          if-no-files-found: ignore
          retention-days: 14
